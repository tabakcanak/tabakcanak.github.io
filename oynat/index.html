<!doctype html>
<html lang="tr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark">

    <title>oynat</title>

    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #151515;
            --surface-2: #1b1b1b;
            --border: #292929;
            --text: #f1f1f1;
            --muted: #8b8b8b;
            --selected: #252525;
            --selected-border: #777;
        }

        :root.light {
            --bg: #f3f3f3;
            --surface: #fff;
            --surface-2: #f7f7f7;
            --border: #ddd;
            --text: #171717;
            --muted: #777;
            --selected: #e9e9e9;
            --selected-border: #555;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        main {
            width: 100%;
            max-width: 1400px;
            margin: auto;
            padding: 16px;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .theme {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 11px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .theme:hover {
            background: var(--surface-2);
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 14px;
        }

        .player {
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        video {
            display: block;
            width: 100%;
            max-height: 75vh;
            background: #000;
        }

        .title {
            padding: 13px 14px;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            border-top: 0;
            border-radius: 0 0 8px 8px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .list {
            overflow-y: auto;
            max-height: calc(75vh + 48px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .item {
            display: block;
            width: 100%;
            padding: 13px 14px;
            border: 0;
            border-bottom: 1px solid var(--border);
            border-left: 2px solid transparent;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 14px;
            line-height: 1.4;
            text-align: left;
            cursor: pointer;
        }

        .item:last-child {
            border-bottom: 0;
        }

        .item:hover {
            background: var(--surface-2);
            color: var(--text);
        }

        .item.active {
            background: var(--selected);
            border-left-color: var(--selected-border);
            color: var(--text);
        }

        .status {
            padding: 18px 14px;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }

        .error {
            color: #e05252;
        }

        @media (max-width: 800px) {
            main {
                padding: 8px;
            }

            .layout {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            video {
                max-height: 65vh;
            }

            .list {
                max-height: 300px;
            }
        }
    </style>
</head>

<body>

    <main>

        <div class="toolbar">
            <button id="theme" class="theme" type="button">
                ☀ Light
            </button>
        </div>

        <div class="layout">

            <section>
                <div class="player">
                    <video id="video" controls playsinline preload="metadata">
                    </video>
                </div>

                <div id="currentTitle" class="title">

                </div>
            </section>

            <aside id="list" class="list">
                <div class="status">
                    Yükleniyor...
                </div>
            </aside>

        </div>

    </main>

    <script>
        const JSON_URL = "https://raw.githubusercontent.com/tabakcanak/data1/refs/heads/main/data1/data1.json";

        const root = document.documentElement;
        const video = document.getElementById("video");
        const list = document.getElementById("list");
        const currentTitle = document.getElementById("currentTitle");
        const theme = document.getElementById("theme");

        const savedTheme = localStorage.getItem("video-theme");

        if (savedTheme === "light") {
            root.classList.add("light");
            root.style.colorScheme = "light";
            theme.textContent = "☾ Dark";
        }

        theme.addEventListener("click", () => {
            const light = root.classList.toggle("light");

            root.style.colorScheme = light ? "light" : "dark";

            theme.textContent = light
                ? "☾ Dark"
                : "☀ Light";

            localStorage.setItem(
                "video-theme",
                light ? "light" : "dark"
            );
        });

        fetch(JSON_URL)
            .then(response => {
                if (!response.ok) {
                    throw new Error();
                }

                return response.json();
            })
            .then(videos => {
                if (!Array.isArray(videos)) {
                    throw new Error();
                }

                list.innerHTML = "";

                const validVideos = videos.filter(
                    item => item && item.url && item.isActive === true
                );

                if (!validVideos.length) {
                    list.innerHTML =
                        '<div class="status">yok</div>';
                    return;
                }

                validVideos.forEach((item, index) => {
                    const button = document.createElement("button");

                    button.type = "button";
                    button.className = "item";
                    button.textContent =
                        item.name || "Video " + (index + 1);

                    button.addEventListener("click", () => {
                        list
                            .querySelectorAll(".item")
                            .forEach(element => {
                                element.classList.remove("active");
                            });

                        button.classList.add("active");

                        video.src = item.url;
                        currentTitle.textContent =
                            item.name || "Video " + (index + 1);

                        video.load();
                        video.play().catch(() => { });
                    });

                    list.appendChild(button);

                    if (index === 0) {
                        button.click();
                    }
                });
            })
            .catch(() => {
                list.innerHTML =
                    '<div class="status error">yok</div>';
            });
    </script>

</body>

</html>
